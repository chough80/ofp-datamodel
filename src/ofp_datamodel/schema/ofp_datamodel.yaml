name: ofp-datamodel
description: LinkML data model for Open Footprint-aligned Scope 1/2 emissions reporting
title: ofp-datamodel
see_also:
- https://ofp-datamodel.terranexus.com.au
id: https://w3id.org/terranexus/ofp-datamodel
imports:
- linkml:types
license: LicenseRef-Custom
prefixes:
  linkml: https://w3id.org/linkml/
  ofp_datamodel: https://w3id.org/terranexus/ofp-datamodel/
  biolink: https://w3id.org/biolink/vocab/
  schema: http://schema.org/
  PATO: http://purl.obolibrary.org/obo/PATO_
  example: http://www.example.org/rdf#
default_prefix: ofp_datamodel
default_range: string
enums:
  PersonStatus:
    description: The vital status of a person
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    permissible_values:
      ALIVE:
        description: the person is living
        meaning: PATO:0001421
      DEAD:
        description: the person is deceased
        meaning: PATO:0001422
      UNKNOWN:
        description: the vital status is not known
slots:
  id:
    description: A unique identifier for a thing
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slot_uri: schema:identifier
    identifier: true
    range: uriorcurie
    required: true
    multivalued: false
  name:
    description: A human-readable name for a thing
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slot_uri: schema:name
    range: string
    required: false
    multivalued: false
  description:
    description: A human-readable description for a thing
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slot_uri: schema:description
    range: string
    required: false
    multivalued: false
  primary_email:
    description: The main email address of a person
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slot_uri: schema:email
    range: string
    required: false
    multivalued: false
  birth_date:
    description: Date on which a person is born
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slot_uri: schema:birthDate
    range: date
    required: false
    multivalued: false
  age_in_years:
    description: Number of years since birth
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    range: integer
    required: false
    multivalued: false
  vital_status:
    description: living or dead status
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    range: PersonStatus
    required: false
    multivalued: false
  people:
    from_schema: https://w3id.org/terranexus/ofp-datamodel
classes:
  NamedThing:
    description: A generic grouping for any identifiable entity
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slots:
    - id
    - name
    - description
    slot_usage:
      id: {}
      name: {}
      description: {}
    class_uri: schema:Thing
  Person:
    description: Represents a Person
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    is_a: NamedThing
    slots:
    - primary_email
    - birth_date
    - age_in_years
    - vital_status
    slot_usage:
      primary_email:
        pattern: ^\S+@[\S+\.]+\S+
      birth_date: {}
      age_in_years: {}
      vital_status: {}
  PersonCollection:
    description: A holder for Person objects
    from_schema: https://w3id.org/terranexus/ofp-datamodel
    slots:
    - people
    slot_usage:
      people:
        description: The Person objects held in this collection
        range: Person
        required: false
        multivalued: true
        inlined_as_list: true
    tree_root: true
